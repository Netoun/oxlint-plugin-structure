name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # release.yml runs it on the tagged commit before publishing

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # oxlint runs JS plugins on Node: prove the `engines` floor.
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test
